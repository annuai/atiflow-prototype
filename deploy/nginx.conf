# Single-page app: every unknown path serves index.html (the router decides what to draw).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers. The Content-Security-Policy is REPORT-ONLY until it has been checked against the real environment (fonts, the API hosts in config.json): fix what it
  # reports, then rename the header to Content-Security-Policy.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://*.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Hashed build files never change: cache for a year. index.html and config.json must always be fetched fresh (a new release / new settings take effect at once).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location = /config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location / {
    try_files $uri /index.html;
  }
}
